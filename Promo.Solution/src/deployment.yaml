apiVersion: apps/v1
kind: Deployment
metadata:
  name: promo-campaign-api
spec:
  selector:
    matchLabels:
      name: promo-campaign-api
  template:
    metadata:
      labels:
        name: promo-campaign-api
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: promo-campaign-api
        image: hrvsterdevservices.azurecr.io/promodev/promocampaignapi
#---
apiVersion: v1
kind: Service
metadata:
  name: promo-campaign-api
spec:
  selector:
    name: promo-campaign-api
  ports:
    - port: 80
      targetPort: 80
