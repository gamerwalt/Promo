apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashtag-hrvster
spec:
  selector:
    matchLabels:
      name: hashtag-hrvster
  template:
    metadata:
      labels:
        name: hashtag-hrvster
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: hashtag-hrvster
        image: gamerwalt/promoharvesterservice
---
apiVersion: v1
kind: Service
metadata:
  name: hashtag-hrvster
spec:
  selector:
    name: hashtag-hrvster
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvester-db
spec:
  selector:
    matchLabels:
      name: harvester-db
  template:
    metadata:
      labels:
        name: harvester-db
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: harvester-db
        image: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: harvester-db
spec:
  selector:
    name: harvester-db
  ports:
  - port: 3306
    targetPort: 3306
