        MYSQL_ROOT_PASSWORD: e@ghX#m5^BTD6tc8
        MYSQL_DATABASE: promo.harvester
        MYSQL_USER: harvester_app_user
        MYSQL_PASSWORD: unqA!S@2mkbx4MK6
    ports:
        - "3310:3306"
