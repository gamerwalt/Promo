version: '3'

services:
  campaigndb:
    image: mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
        MYSQL_ROOT_PASSWORD: iKv7w99Jb^2mKn7%
        MYSQL_DATABASE: promo.campaign
        MYSQL_USER: campaign_app_user
        MYSQL_PASSWORD: iKv7w99Jb^2mKn7%
    ports:
        - "3308:3306"
    volumes:
        - ./databases/CampaignDb/init-file.sql:/docker-entrypoint-initdb.d/1.sql
    build:
        context: .
  campaignapi:
    build:
        context: .
        dockerfile: Dockerfile
        target: final-campaignapi
    depends_on:
        - campaigndb
    ports:
        - "5003:80"
        - "5002:443"
    restart: always
    environment:
        - ConnectionStrings_Campaign=campaigndb
        - ASPNETCORE_ENVIRONMENT=Development
